<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carpet Markets — launch a coin on Kei</title>
    <meta
      name="description"
      content="A coin launchpad where the difference between a rug and a real one is a transfer policy the chain enforces. A Kei example. Nothing here is worth anything."
    />
    <link rel="icon" href="./favicon.ico" />
    <style>
      :root {
        --bg: #0b0d10;
        --panel: #14181d;
        --line: #232a32;
        --ink: #e6edf3;
        --dim: #8b949e;
        --gold: #e3b341;
        --green: #7ee787;
        --red: #ff5c5c;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      #app {
        display: grid;
        grid-template-columns: minmax(320px, 1fr) minmax(340px, 1.2fr);
        grid-template-areas: "top top" "board detail";
        gap: 20px;
        max-width: 1180px;
        margin: 0 auto;
        padding: 24px 20px 64px;
      }

      @media (max-width: 860px) {
        #app {
          grid-template-columns: 1fr;
          grid-template-areas: "top" "board" "detail";
        }
      }

      .top {
        grid-area: top;
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: flex-end;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
        padding-bottom: 16px;
      }

      h1 {
        margin: 0;
        font-size: 26px;
        letter-spacing: -0.02em;
      }

      .brand p {
        margin: 4px 0 0;
        color: var(--dim);
        font-size: 14px;
      }

      .wallet {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        font-variant-numeric: tabular-nums;
      }

      .addr,
      .network {
        color: var(--dim);
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 12px;
      }

      .board,
      .detail {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
      }

      .board {
        grid-area: board;
      }
      .detail {
        grid-area: detail;
      }

      .board-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      h2 {
        margin: 0;
        font-size: 16px;
      }

      .cards {
        display: grid;
        gap: 10px;
      }

      .card {
        display: grid;
        gap: 6px;
        width: 100%;
        text-align: left;
        background: #0f1317;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      .card:hover {
        border-color: #35404b;
      }

      .card-on {
        border-color: var(--gold);
      }

      .card-top {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .card-name {
        color: var(--dim);
        font-size: 13px;
      }

      .card-foot {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        color: var(--dim);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      .held {
        color: var(--gold);
      }

      .mult {
        margin-left: auto;
        color: var(--green);
        font-variant-numeric: tabular-nums;
      }

      .bar {
        height: 4px;
        background: #1c2229;
        border-radius: 2px;
        overflow: hidden;
      }

      .bar-fill {
        height: 100%;
        background: var(--gold);
      }

      .badge {
        font-size: 10px;
        letter-spacing: 0.08em;
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid currentColor;
        cursor: help;
      }

      .badge-carpet {
        color: var(--red);
      }
      .badge-safe {
        color: var(--green);
      }
      .badge-rugged {
        color: var(--red);
        border-style: dashed;
      }
      .badge-graduated {
        color: var(--green);
        border-style: dashed;
      }

      button {
        font: inherit;
        cursor: pointer;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: #1b2129;
        color: var(--ink);
        padding: 8px 12px;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .launch {
        background: var(--gold);
        border-color: var(--gold);
        color: #16130a;
        font-weight: 600;
      }

      .buy {
        background: var(--green);
        border-color: var(--green);
        color: #06210e;
        font-weight: 600;
        width: 100%;
      }

      .sell {
        background: transparent;
        border-color: var(--red);
        color: var(--red);
        width: 100%;
      }

      .rug {
        background: transparent;
        border: 1px dashed var(--red);
        color: var(--red);
      }

      .ghost {
        background: transparent;
      }

      .chart {
        width: 100%;
        height: 180px;
        display: block;
        margin: 12px 0;
        background: #0f1317;
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 10px;
        margin: 0 0 14px;
      }

      .stat dt {
        color: var(--dim);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .stat dd {
        margin: 2px 0 0;
        font-variant-numeric: tabular-nums;
        overflow-wrap: anywhere;
      }

      .trade {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      @media (max-width: 520px) {
        .trade {
          grid-template-columns: 1fr;
        }
      }

      label {
        display: block;
        color: var(--dim);
        font-size: 12px;
        margin-bottom: 4px;
      }

      input {
        width: 100%;
        background: #0f1317;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        padding: 8px 10px;
        font: inherit;
        font-variant-numeric: tabular-nums;
      }

      .preview {
        margin: 6px 0 8px;
        color: var(--dim);
        font-size: 12px;
      }

      .blurb {
        color: var(--dim);
        margin: 6px 0 0;
      }

      .detail-head {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .deed {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 16px;
        padding: 12px;
        border: 1px dashed var(--line);
        border-radius: 10px;
      }

      .closed {
        margin-top: 4px;
        padding: 12px;
        border-left: 3px solid var(--line);
        color: var(--dim);
      }

      .provenance {
        margin-top: 16px;
        color: var(--dim);
        font-size: 13px;
      }

      .provenance dl {
        display: grid;
        gap: 8px;
        margin: 10px 0;
      }

      .provenance dd {
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 11px;
      }

      .empty {
        color: var(--dim);
      }

      .fatal {
        color: var(--red);
        padding: 24px;
      }

      .sheet {
        position: fixed;
        inset: 50% auto auto 50%;
        transform: translate(-50%, -50%);
        width: min(520px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        overflow: auto;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 20px;
        display: grid;
        gap: 8px;
        box-shadow: 0 24px 60px #000a;
        z-index: 10;
      }

      .fee {
        color: var(--dim);
        font-size: 13px;
        margin: 0 0 8px;
      }

      .choices {
        display: grid;
        gap: 8px;
      }

      .choice {
        display: grid;
        gap: 4px;
        text-align: left;
        padding: 12px;
      }

      .choice span {
        color: var(--dim);
        font-size: 12px;
      }

      .choice-on {
        border-color: var(--gold);
      }

      .sheet-foot {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 8px;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        max-width: min(680px, calc(100vw - 32px));
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: #0f1317;
        font-size: 13px;
        z-index: 20;
      }

      .toast-bad {
        border-color: var(--red);
        color: #ffd7d7;
      }

      .footnote {
        grid-column: 1 / -1;
        color: var(--dim);
        font-size: 12px;
        border-top: 1px solid var(--line);
        padding-top: 14px;
      }

      .footnote a {
        color: var(--gold);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <p class="footnote" style="max-width: 1180px; margin: 0 auto; padding: 0 20px 40px">
      A worked example for <a href="https://keicoin.org">Kei</a>. The chain under this page is a mock or a testnet, every
      coin on it is worthless by construction, and the rug is a mechanic rather than a warning — which is the only
      setting in which it is safe to show you exactly how one works.
      <a href="https://github.com/keicoin-org/carpet-markets">Source</a>.
    </p>
    <script type="module" src="./build/main.js"></script>
  </body>
</html>
